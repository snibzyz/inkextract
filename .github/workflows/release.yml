name: Release builds

# Triggers
#   - Tag push: v*.*.*  -> builds and uploads release artifacts to that tag
#   - workflow_dispatch -> manual trigger for testing

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write   # needed to upload assets to a GitHub Release

env:
  # Portable Python distribution from python-build-standalone (astral-sh).
  # Extracts to ./python/ with the layout we want (no installer needed).
  PBS_RELEASE: "20241016"
  PYTHON_VERSION: "3.12.7"

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            artifact: INKEXTRACT-windows-x64.zip
            pbs_arch: x86_64-pc-windows-msvc-install_only.tar.gz
          - os: macos-13          # Intel
            label: macos-x64
            artifact: INKEXTRACT-macos-x64.zip
            pbs_arch: x86_64-apple-darwin-install_only.tar.gz
          - os: macos-latest      # Apple Silicon
            label: macos-arm64
            artifact: INKEXTRACT-macos-arm64.zip
            pbs_arch: aarch64-apple-darwin-install_only.tar.gz

    steps:
      - uses: actions/checkout@v4

      # ---------- 1. Download portable Python ----------
      - name: Download portable Python (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          URL="https://github.com/astral-sh/python-build-standalone/releases/download/${PBS_RELEASE}/cpython-${PYTHON_VERSION}+${PBS_RELEASE}-${{ matrix.pbs_arch }}"
          curl -fL --retry 3 -o python.tar.gz "$URL"
          mkdir -p bundle
          tar -xzf python.tar.gz -C bundle
          # The tarball extracts to bundle/python/
          test -x bundle/python/bin/python3

      - name: Download portable Python (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/astral-sh/python-build-standalone/releases/download/$env:PBS_RELEASE/cpython-$env:PYTHON_VERSION+$env:PBS_RELEASE-${{ matrix.pbs_arch }}"
          Invoke-WebRequest -Uri $url -OutFile python.tar.gz
          New-Item -ItemType Directory -Path bundle -Force | Out-Null
          tar -xzf python.tar.gz -C bundle
          # The tarball extracts to bundle/python/
          if (-not (Test-Path "bundle/python/python.exe")) { throw "python.exe not found after extract" }

      # ---------- 2. Install requirements into bundled Python ----------
      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            PY="bundle/python/python.exe"
          else
            PY="bundle/python/bin/python3"
          fi
          "$PY" -m pip install --upgrade pip --disable-pip-version-check
          "$PY" -m pip install -r .app/requirements.txt --disable-pip-version-check

      # ---------- 3. Copy app code into bundle ----------
      - name: Stage app code
        shell: bash
        run: |
          set -euxo pipefail
          # copy .app directory (source code + VERSION)
          cp -R .app bundle/.app
          # copy .config (ships the default exclude.txt template so the
          # user gets the same starting state as a fresh dev checkout)
          cp -R .config bundle/.config
          # ensure workspace structure exists (PascalCase INKIDEA-style layout v1.1.0+)
          mkdir -p bundle/workspace/Raw
          mkdir -p bundle/workspace/Input
          mkdir -p bundle/workspace/Fix
          mkdir -p bundle/workspace/Clean
          mkdir -p bundle/workspace/Finish
          mkdir -p bundle/workspace/Merge
          mkdir -p bundle/workspace/Separate
          mkdir -p bundle/workspace/Import
          mkdir -p bundle/workspace/Output
          mkdir -p bundle/workspace/Vocab
          mkdir -p bundle/workspace/Style
          mkdir -p bundle/workspace/Prompt
          mkdir -p bundle/workspace/Temp
          mkdir -p bundle/workspace/Error/error_trans

      # ---------- 4. Add per-OS launcher ----------
      # Launchers (Start.bat / Start.command) live at the repo root - same files
      # devs use locally - so the bundle and source tree are structurally
      # identical. README-FIRST.txt is bundle-only (end-user instructions).
      - name: Add Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item Start.bat bundle/Start.bat
          if (Test-Path "build/win/README-FIRST.txt") {
              Copy-Item build/win/README-FIRST.txt bundle/README-FIRST.txt
          }

      - name: Add macOS launcher
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cp Start.command bundle/Start.command
          chmod +x bundle/Start.command
          cp build/mac/README-FIRST.txt bundle/README-FIRST.txt 2>/dev/null || true

      # ---------- 5. Create archive ----------
      - name: Rename bundle folder
        shell: bash
        run: mv bundle INKEXTRACT

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path INKEXTRACT -DestinationPath "${{ matrix.artifact }}" -Force

      - name: Zip (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # ditto preserves macOS extended attributes / executable bits
          ditto -c -k --sequesterRsrc --keepParent INKEXTRACT "${{ matrix.artifact }}"

      # ---------- 6. Upload artifact (always) + release asset (on tag) ----------
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: ${{ matrix.artifact }}
          retention-days: 14

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
          fail_on_unmatched_files: true
